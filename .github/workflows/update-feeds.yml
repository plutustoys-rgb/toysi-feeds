name: Update Rozetka feed (Prom/Google/Meta/Bing/EVA + репрайсер — на VPS feed-pipeline.timer)

# ЗВУЖЕНО (2026-07-28, пряме рішення власниці — "Фаза 2 переносить УСЕ,
# крім Rozetka"): цей job тепер відповідає ВИКЛЮЧНО за
# feeds/rozetka_feed.xml. Google/Meta/Bing/EVA-фіди, репрайсер Prom
# (--apply), prom_feed_top.xml — усе це перенесено на VPS
# (run_feed_pipeline_vps.sh, feed-pipeline.timer).
#
# ЧОМУ РОЗДІЛЕННЯ САМЕ ТАК: живий інцидент 2026-07-28 — ручний
# workflow_dispatch цього ж job'у (коли він ще робив УСЕ) перетнувся зі
# звичайним запланованим прогоном (3г24хв паралельно), і той, що
# завершився пізніше, force-push'ем затер легітимну публікацію іншого —
# prom_feed_top.xml впав з ~6000 до 1575 офферів. Той самий клас гонки,
# що вже спричиняв інцидент 2026-07-19. Розділення на GH Actions
# (ЛИШЕ Rozetka) і VPS (усе інше) означає: навіть якщо обидва колись
# запустяться одночасно, вони пишуть у РІЗНІ файли feed-data — жодного
# спільного файлу для перезапису.
#
# `schedule:` НЕ закоментовано (на відміну від попередньої версії,
# коли job робив усе) — пряме рішення власниці. Rozetka-фід тепер
# легкий (заморожений статичний відбір, rozetka_static_selection.json,
# жодної живої репрайсинг-логіки) — плановий прогін щочотири години
# безпечний і не конфліктує з VPS, бо VPS більше НЕ торкається
# feeds/rozetka_feed.xml узагалі.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

env:
  FEED_BRANCH: feed-data

# concurrency-група лишається — запобігає накладенню ДВОХ прогонів
# ЦЬОГО САМОГО job'у одне на одного (напр. ручний workflow_dispatch під
# час планового прогону) — той самий принцип, що й раніше, просто
# тепер захищає лише Rozetka-частину.
concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TOYSI_API_KEY: ${{ secrets.TOYSI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # ВИПРАВЛЕНО (знахідка аудиту pt7, 2026-07-27, PR #179): без цього
      # кроку rozetka_static_selection.json НІКОЛИ не існує на старті
      # ефемерного GH Actions runner'а — _build_rozetka_static_selection()
      # виконувала б гілку "перший виклик" (живий перерахунок із
      # catalog ЦЬОГО прогону) КОЖЕН раз, замість заморозити список один
      # раз назавжди. Фолбек `{}` безпечний: функція сама трактує
      # відсутні ключі "items"/"prices" як "файл пошкоджений/відсутній"
      # і формує список заново (лише якщо він СПРАВДІ ще не існував).
      - name: Restore rozetka_static_selection.json from ${{ env.FEED_BRANCH }}
        run: |
          git fetch origin "$FEED_BRANCH" 2>/dev/null || true
          git show "origin/$FEED_BRANCH:rozetka_static_selection.json" > rozetka_static_selection.json 2>/dev/null \
            || echo '{}' > rozetka_static_selection.json

      # own_product_links_cache.json — ЛИШЕ ЧИТАННЯ (Rozetka-фід читає
      # цей кеш для <url>-тегу, ніколи не пише й не публікує). Кеш тепер
      # БУДУЄТЬСЯ на VPS (generate_google_feed.py, run_feed_pipeline_vps.sh)
      # і публікується звідти в feed-data — цей крок лише читає
      # НАЙСВІЖІШУ опубліковану версію. Read-only залежність, не
      # створює конфлікту запису з VPS.
      - name: Restore own_product_links_cache.json from ${{ env.FEED_BRANCH }} (read-only, VPS-published)
        continue-on-error: true
        run: |
          git show "origin/$FEED_BRANCH:own_product_links_cache.json" > own_product_links_cache.json 2>/dev/null \
            || echo '{}' > own_product_links_cache.json

      # ВИПРАВЛЕНО (2026-07-20, задача власниці — "розділити публікацію
      # Rozetka/Prom фідів, щоб збій одного не блокував інший"): крах
      # самого generate_rozetka_feed.py не повинен зупиняти job — id:
      # gen_rozetka дає фолбек-кроку нижче змогу перевірити РЕАЛЬНИЙ
      # результат саме цього кроку (не лише --preflight).
      - name: Generate Rozetka feed
        id: gen_rozetka
        continue-on-error: true
        run: python generate_rozetka_feed.py

      # Задача власниці 2026-07-15: "системне рішення замість реактивних
      # патчів" — rozetka_feed_preflight() зводить УСІ відомі класи
      # помилок валідатора в один прогін, ПІСЛЯ генерації, ПЕРЕД
      # публікацією нижче. continue-on-error: true — окремий фолбек-крок
      # нижче підміняє потенційно зламаний rozetka_feed.xml на останню
      # опубліковану РОБОЧУ версію, якщо preflight провалився.
      - name: Rozetka feed preflight
        id: rozetka_preflight
        continue-on-error: true
        run: python generate_rozetka_feed.py --preflight

      # Умова покриває і крах САМОЇ генерації, і preflight.
      - name: Restore last known-good rozetka_feed.xml (generation or preflight failed this run)
        if: steps.gen_rozetka.outcome == 'failure' || steps.rozetka_preflight.outcome == 'failure'
        run: |
          echo "::error::Rozetka feed генерація або preflight провалились — публікую ОСТАННЮ РОБОЧУ версію rozetka_feed.xml замість щойно згенерованої."
          git fetch origin "$FEED_BRANCH" 2>/dev/null || true
          git show "origin/$FEED_BRANCH:feeds/rozetka_feed.xml" > feeds/rozetka_feed.xml 2>/dev/null || true
          python -c "
          from telegram_notify import send_telegram_message
          send_telegram_message(
              '⚠️ update-feeds.yml (Rozetka): генерація/preflight провалились цього прогону — '
              'публікується попередня робоча версія rozetka_feed.xml. Деталі: '
              'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          )
          "

      - name: Verify Rozetka feed was generated
        run: |
          if [ ! -s feeds/rozetka_feed.xml ]; then
            echo "::error::feeds/rozetka_feed.xml не згенеровано (порожній файл або відсутній, і фолбек з feed-data теж не спрацював — ймовірно, перший запуск до існування гілки feed-data) — ймовірно, TOYSI_API_KEY secret відсутній/невалідний, або Toysi API недоступний."
            exit 1
          fi

      # Публікуємо ЛИШЕ feeds/rozetka_feed.xml + rozetka_static_selection.json
      # у feed-data — orphan force-push, БЕЗ росту історії (той самий
      # принцип, що й раніше).
      #
      # КРИТИЧНО (2026-07-28, знайдено ДО живого прогону, той самий
      # клас ризику, що й у publish_feed_pipeline_vps.sh на VPS): просте
      # "цей job додає лише свої файли" НЕ РЯТУЄ від взаємного
      # затирання, поки і GH Actions, і VPS роблять orphan-коміт —
      # кожен такий коміт будує ПОРОЖНЄ дерево з нуля, тож хто б не
      # запушив ПІЗНІШЕ, стирає ВСЕ, чого немає в його власному коміті
      # (включно з файлами VPS — prom_feed_top.xml,
      # own_product_links_cache.json, prom_competitor_price_state.json,
      # google/meta/bing/eva-фіди). Тому: перед стейджингом власних
      # файлів ПІДТЯГУЄМО ПОВНЕ поточне дерево feed-data (git checkout
      # origin/feed-data -- .) — комміт лишається "плоским" (без росту
      # історії), але містить УСІ файли: свій (щойно перезаписаний) і
      # чужі (VPS — незмінні, збережені як є).
      - name: Publish Rozetka feed to ${{ env.FEED_BRANCH }} (force-push, preserves VPS-owned files)
        run: |
          # ОКРЕМА тимчасова директорія (не поточний checkout) — навмисно:
          # git checkout "origin/$FEED_BRANCH" -- . нижче ВІДНОВЛЮЄ файли з
          # feed-data на диск, і якби це робилось у ТІЙ САМІЙ директорії, де
          # вже лежить щойно згенерований feeds/rozetka_feed.xml, воно
          # перезаписало б його СТАРОЮ версією з feed-data — саме той клас
          # багу, якого весь цей крок і мав уникнути. Копіюємо свіжі файли
          # в тимчасову директорію ЯВНО, після відновлення чужого дерева.
          SRC_DIR="$GITHUB_WORKSPACE"
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"

          git fetch --depth 1 origin "$FEED_BRANCH" 2>/dev/null || true
          git checkout --orphan "$FEED_BRANCH" -q
          git checkout "origin/$FEED_BRANCH" -- . 2>/dev/null || true

          mkdir -p feeds
          cp "$SRC_DIR/feeds/rozetka_feed.xml" feeds/rozetka_feed.xml
          cp "$SRC_DIR/rozetka_static_selection.json" rozetka_static_selection.json

          # -f: feeds/*.xml навмисно в .gitignore для master (щоб не роздувати її
          # історію), але саме ці файли й мають бути закомічені сюди, на feed-data —
          # без -f git add мовчки відмовляється додавати файли, що збігаються з .gitignore.
          git add -f feeds/rozetka_feed.xml rozetka_static_selection.json
          git commit -q -m "Rozetka feed update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force origin "$FEED_BRANCH:$FEED_BRANCH"
