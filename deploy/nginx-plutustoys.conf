# nginx для plutustoys.com.ua — статика напряму + проксі /api/ на site_order_api (127.0.0.1:8901).
# TLS видає certbot (--nginx) — він сам допише listen 443 + сертифікати й редірект 80→443.

# ── 301-міграція старих Prom-URL, щоб не пропала GMC/Google Shopping ──
# GMC-фід віддає посилання https://plutustoys.com.ua/ua/p{prom_id}-{slug}.html (Prom-структура).
# Ця мапа веде prom_id → нашу картку /product-{toysi_id}.html (генерує generate_prom_redirects.py).
# default (/catalog.html) — для непокритих старих URL, щоб не було жорсткого 404. Блок на http-рівні
# (файл підключається всередині http{} через sites-enabled), тож map тут валідний.
map $prom_pid $prom_redirect {
    default /catalog.html;
    include /opt/plutustoys/prom_redirects.map;
}

server {
    listen 80;
    listen [::]:80;
    server_name plutustoys.com.ua www.plutustoys.com.ua;

    # Згенерований статичний сайт (build_site.py → /opt/plutustoys/site/*.html + assets + index.json)
    root /opt/plutustoys/site;
    index index.html;

    # Старі Prom-URL (/ua/p{prom_id}-slug.html) → 301 на нашу картку (збереження GMC/SEO).
    # Регекс-локейшн перевіряється першим; захоплює prom_id, map дає ціль.
    location ~ ^/ua/p(\d+)- {
        set $prom_pid $1;
        return 301 $prom_redirect;
    }

    # Кеш ассетів (css/js/json оновлюються при ребілді)
    location ~* \.(?:css|js|json|png|jpe?g|webp|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API замовлень/НП/колбек — на python-сервер
    location /api/ {
        proxy_pass http://127.0.0.1:8901;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Решта — статика; невідомий шлях → 404
    location / {
        try_files $uri $uri/ =404;
    }
}
